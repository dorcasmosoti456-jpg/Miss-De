    <main class="page-shell">
        <section class="content-panel">
            <div class="intro-banner">
                <div class="marquee" aria-label="Animated title">
                    <div class="marquee-text">CONTACT ME</div>
                </div>
            </div>

            <p><strong>Phone:</strong> 0718096477</p>

            <p>
                <strong>Email:</strong>
                <a href="mailto:dorcasmosoti456@gmail.com">dorcasmosoti456@gmail.com</a>
            </p>

            <h3>Contact Form</h3>

            <form method="post" action="#">
                <label for="name">Enter your Name</label>
                <input id="name" name="name" type="text" required>

                <label for="email">E-mail address</label>
                <input id="email" name="email" type="email" required>

                <label for="subject">Message Subject</label>
                <input id="subject" name="subject" type="text">

                <label for="message">Enter your Message</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <div class="checkbox-row">
                    <input type="checkbox" id="copy" name="copy">
                    <label for="copy">E-mail a copy of this message to your own address.</label>
                </div>

                <button type="submit">Send Message</button>
            </form>
        </section>
